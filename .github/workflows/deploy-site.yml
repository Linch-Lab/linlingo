name: Deploy website

# 只要 docs\ 底下的檔案有變更並 push 到 main，就自動同步到 Hostinger。
# 也可以在 GitHub Actions 頁面手動觸發（Run workflow）。

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload docs/ to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # 例如 /public_html/你的網域/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./docs/
          exclude: |
            **/.git*
            **/.git*/**
            **/README.txt
            **/*.md
